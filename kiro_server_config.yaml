# =============================================================================
# Kiro Beast API Server Configuration
# =============================================================================
# This server accepts audio from thin clients (Pi 5), processes it through
# the full Kiro pipeline (STT → LLM → TTS), and returns synthesized speech.
#
# Usage:
#   python kiro_server.py --config kiro_server_config.yaml
#
# Test with curl:
#   curl -X POST http://localhost:5400/process \
#     -H "Content-Type: audio/wav" \
#     --data-binary @test_recording.wav \
#     --output response.wav

server:
  host: "0.0.0.0"        # Listen on all interfaces (Tailscale included)
  port: 5400
  debug: false

# ---------------------------------------------------------------------------
# STT — Speech-to-Text (faster_whisper, same as main Kiro pipeline)
# ---------------------------------------------------------------------------
stt:
  model_size: "tiny.en"   # tiny.en (~0.3s), small.en (~1.1s) for better accuracy
  device: "cuda"           # cuda | cpu
  compute_type: "float16"  # float16 (GPU) | int8 (CPU)
  cpu_threads: 8
  num_workers: 1
  language: "en"
  beam_size: 1

# ---------------------------------------------------------------------------
# LLM — Language Model (OpenAI-compatible API)
# ---------------------------------------------------------------------------
# Works with: OpenAI direct, OpenRouter, any OpenAI-compatible endpoint.
# For OpenRouter, set:
#   api_key_env: OPENROUTER_API_KEY
#   base_url: https://openrouter.ai/api/v1
#   model: openai/gpt-4o-mini
llm:
  api_key_env: "OPENAI_API_KEY"
  base_url: null           # null = default OpenAI; set URL for OpenRouter/other
  model: "gpt-4o"
  temperature: 0.4
  max_tokens: 200

# ---------------------------------------------------------------------------
# TTS — Text-to-Speech (Kokoro-82M primary, Piper fallback)
# ---------------------------------------------------------------------------
tts:
  engine: "kokoro"         # kokoro | piper
  kokoro:
    device: "cuda"         # cuda | cpu
    speed: 1.0
    voice_map:
      kiro:   "af_heart"
      ops:    "am_adam"
      sage:   "bm_george"
      finley: "bm_lewis"
      coach:  "am_michael"
      chef:   "bf_emma"
      doc:    "af_nicole"
      ruth:   "bf_isabella"
      lisa:   "bf_lily"
      jack:   "am_adam"
  piper:
    executable: "/usr/bin/piper"
    output_sample_rate: 22050
    voice_map:
      kiro:   "./data/voices/en_US-amy-medium.onnx"

# ---------------------------------------------------------------------------
# Persona routing (keyword-based, sticky)
# ---------------------------------------------------------------------------
router:
  default_persona: "kiro"
  reset_words: ["kiro", "cairo", "kyro", "key-ro", "default", "reset", "home"]
  keyword_map:
    finley: ["finley", "finlay", "budget", "money", "spending", "finance"]
    chef:   ["chef", "cook", "recipe", "meal", "grocery", "food"]
    coach:  ["coach", "task", "tasks", "project", "projects", "plan", "focus", "next action", "inbox", "capture", "stuck", "overwhelmed", "procrastinating", "executive function"]
    doc:    ["doc", "stress", "anxiety", "feeling", "overwhelmed"]
    ruth:   ["ruth", "presence", "lonely", "heart", "connection"]
    lisa:   ["lisa", "chat", "hang out", "bored", "funny", "comedy"]
    sage:   ["sage", "philosophy", "debate", "challenge", "ethics"]
    ops:    ["ops", "code", "bug", "server", "deploy", "python", "linux"]
    jack:   ["jack", "grow", "grower", "plant", "tent", "strain", "cannabis", "weed", "harvest", "flower", "vpd", "dli"]

# ---------------------------------------------------------------------------
# Session management (in-memory conversation history)
# ---------------------------------------------------------------------------
session:
  max_history_turns: 20    # Rolling window of recent turns
  expire_minutes: 60       # Auto-expire idle sessions

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  file: "./logs/kiro_server.log"
  max_bytes: 10485760
  backup_count: 5
