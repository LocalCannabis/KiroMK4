    - read_sheet_range
    - write_sheet_cells
    - append_sheet_row
    - create_spreadsheet
    # Gmail
    - read_emails
    - read_email_content
    - send_email
    - reply_to_email
    - draft_email
    - search_emails
    # Google Docs
    - create_doc
    - append_to_doc
    - read_doc
    # Google Drive
    - search_drive
    - list_drive_folder
    - get_file_info
    # Finley YNAB financial tools
    - ynab_spending_by_category
    - ynab_spending_by_payee
    - ynab_spending_trend
    - ynab_daily_spending_rate
    - ynab_top_transactions
    - ynab_budget_vs_actual
    - ynab_overspent_categories
    - ynab_remaining_budget
    - ynab_days_until_broke
    - ynab_account_balances
    - ynab_net_worth
    - ynab_credit_card_balances
    - ynab_upcoming_bills
    - ynab_recurring_summary
    - ynab_income_vs_expenses
    - ynab_recent_transactions
    # Finley profiling tools
    - finley_get_profile
    - finley_get_stage
    - finley_start_cfpb_assessment
    - finley_submit_cfpb_answer
    - finley_get_spending_snapshot
    - finley_get_knowledge
    # Jack grow management tools
    - jack_log_checkin
    - jack_get_grow_status
    - jack_get_recent_logs
    - jack_update_grow_stage
    - jack_log_watering
    - jack_get_feeding_schedule
    - jack_compute_vpd
    - jack_compute_dli
    - jack_create_grow
    - jack_setup_tent
    - jack_list_grows
    # Coach executive function tools
    - coach_add_task
    - coach_list_tasks
    - coach_complete_task
    - coach_update_task
    - coach_add_project
    - coach_list_projects
    - coach_project_status
    - coach_capture_dump
    - coach_whats_next
    - coach_plan_day
    - coach_daily_progress
    - coach_inbox_review
    - coach_weekly_review
    - coach_energy_check

offline:
  cloud_failover_order: [openai, ollama, pi]
  cloud_timeout_s: 8
  local_timeout_s: 20

sync:
  enabled: false
  workshop_host: 192.168.1.10
  api_port: 8765

observability:
  metrics_enabled: false
  health_check_s: 60
