version: 1
profile: workshop-dev

logging:
  level: INFO
  file: ./logs/kiro.log
  max_bytes: 10485760
  backup_count: 5
  json: false

audio:
  input:
    # alsa_device: 'default' routes through PipeWire to the system default mic.
    # For direct ALSA access (prod Mackie): hw:1,0
    alsa_device: "default"
    device_name: "Logi USB Headset"
    sample_rate: 16000
    channels: 1
    dtype: int16
    # Silero VAD v5 requires EXACTLY 512 samples per chunk at 16kHz = 32ms.
    block_ms: 32
  output:
    # alsa_device: 'default' routes through PipeWire to the system default speaker.
    # For direct ALSA access (prod Mackie): hw:1,0
    alsa_device: "default"
    device_name: "Logi USB Headset"
    sample_rate: 22050
    channels: 1

vad:
  engine: silero # silero | energy
  silero:
    threshold: 0.45
  energy:
    rms_threshold: 0.020
  start_trigger_frames: 3
  end_silence_ms: 900
  max_utterance_s: 20

stt:
  engine: faster_whisper # faster_whisper | openai
  faster_whisper:
    # small.en: significantly better accuracy than tiny.en; ~500MB on GPU, ~1.1s RTF
    # beam_size 5: proper beam-search decode vs greedy — higher accuracy at modest cost
    model_size: small.en
    device: cuda
    compute_type: float16
    cpu_threads: 8
    num_workers: 1
    language: en
    beam_size: 5
    initial_prompt: "Kiro assistant. Tim speaking."
  openai:
    model: gpt-4o-mini-transcribe

ai:
  provider: openai # openai | ollama | llama_cpp
  timeout_s: 30
  streaming: true
  openai:
    model: gpt-4o
    temperature: 0.4
    max_tokens: 200
    api_key_env: OPENAI_API_KEY

  # ---------------------------------------------------------------------------
  # UI model routing — OpenRouter + Claude tiers
  # The UI uses these instead of ai.openai above.
  # Set OPENROUTER_API_KEY in .env to enable.
  # ---------------------------------------------------------------------------
  ui_routing:
    provider: anthropic               # anthropic | openrouter | openai
    base_url: https://api.anthropic.com  # not used for native anthropic SDK
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0.4
    # Model tiers — real Anthropic model IDs
    models:
      fast:     claude-haiku-4-5       # Simple lookups, quick Q&A
      balanced: claude-sonnet-4-6      # Analysis, multi-step reasoning
      deep:     claude-opus-4-6        # Strategy, planning, serious deep dives
    # Per-persona default minimum tier (fast/balanced/deep)
    persona_floor:
      kiro:   fast
      finley: fast
      coach:  balanced
      jack:   fast
      chef:   fast
      doc:    balanced
      sage:   balanced
  ollama:
    model: mistral:7b-instruct-q4_K_M
    base_url: http://127.0.0.1:11434
  llama_cpp:
    model_path: ./models/llm/llama-3.1-8b-instruct-q4_k_m.gguf

  # ---------------------------------------------------------------------------
  # Local model routing — Ollama on Beast GPU (zero API cost)
  # Install models:  ollama pull llama3.2:3b-instruct-q4_K_M
  #                  ollama pull qwen2.5:14b-instruct-q4_K_M
  # ---------------------------------------------------------------------------
  local:
    enabled: true
    base_url: http://127.0.0.1:11434
    health_check_interval_s: 30
    tools_supported: true       # Llama 3.2+ and Qwen 2.5 support tool calling
    models:
      fast:    llama3.2:3b-instruct-q4_K_M    # ~1-2s on RTX 3060, simple Q&A
      capable: qwen2.5:14b-instruct-q4_K_M    # ~5-10s on RTX 3060, medium tasks

tts:
  # Primary engine: kokoro (82M-param, 54 voices, 24kHz, Apache 2.0)
  # Fallback engine: piper (offline, Pi-safe, 22050Hz)
  # Chatterbox deferred: pkgutil.ImpImporter removed in Python 3.12
  engine: kokoro # kokoro | piper
  default_persona: kiro

  kokoro:
    # GPU confirmed working: RTF 0.023x on RTX 3060 (~118ms/sentence vs ~1171ms CPU).
    # Requires LD_LIBRARY_PATH from kiro_asr conda activate hook (nvidia_libs.sh).
    device: cuda
    speed: 1.0  # global speed multiplier; tune per-persona in code if needed
    voice_map:
      kiro:   af_heart    # warm, neutral American female — default assistant voice
      ops:    am_adam     # flat, efficient American male — technical/code persona
      sage:   bm_george   # intellectual British male — philosophy/debate
      finley: bm_lewis    # measured, authoritative British male — finance
      coach:  am_michael  # calm American male — executive function coach
      chef:   bf_emma     # warm British female — cooking/recipes
      doc:    af_nicole   # gentle, soft American female — wellness/mental health
      ruth:   bf_isabella # warm British female — companion, loving clarity
      lisa:   bf_lily     # lively British female — always-on companion, quirky and fun
      jack:   am_adam     # calm, slightly gravelly American male — master grower

  # Piper fallback (used when Kokoro unavailable or for Pi deployment)
  piper_voice_map:
    kiro:   ./data/voices/en_US-amy-medium.onnx
    ops:    ./data/voices/en_US-amy-medium.onnx
    sage:   ./data/voices/en_US-lessac-high.onnx
    finley: ./data/voices/en_US-lessac-high.onnx
    chef:   ./data/voices/en_US-lessac-high.onnx
    coach:  ./data/voices/en_US-amy-medium.onnx
    doc:    ./data/voices/en_US-lessac-high.onnx
    ruth:   ./data/voices/en_US-lessac-high.onnx
    lisa:   ./data/voices/en_US-lessac-high.onnx
    jack:   ./data/voices/en_US-lessac-high.onnx
  piper:
    executable: /home/macklemoron/Projects/KiroMKIII/bin/piper/piper
    output_sample_rate: 22050

  openai:
    model: gpt-4o-mini-tts
    voice: alloy

  # ── Orpheus TTS (replaces Kokoro when ORPHEUS_ENABLED=true) ────────────────
  # Voice assignments are stored in PostgreSQL (kiro_voices table).
  # Set ORPHEUS_ENABLED=true in .env to activate.
  orpheus:
    api_url: http://localhost:5005
    model: orpheus-tts-0.1-finetune-prod-Q8_0.gguf
    default_voice: leah        # built-in fallback; overridden by kiro_voices table
    lead_pad_ms: 50
    trail_pad_ms: 150
    gpu_mem_util: 0.35         # keep VRAM headroom for Whisper + LLM
    voice_refs_dir: /home/kiro/voice_refs

router:
  default_persona: kiro
  mode: keywords # keywords | model
  keyword_map:
    finley: [finley, finlay, budget, money, spending, rent, debt, finance, finances, financial]
    chef: [chef, cook, recipe, ingredient, meal, grocery, food, eating]
    coach: [coach, task, tasks, project, projects, plan, focus, next action, inbox, capture, stuck, overwhelmed, procrastinating, executive function]
    doc: [doc, stress, anxiety, feeling, overwhelmed, sad, mental, therapy, emotions]
    ruth: [ruth, presence, lonely, lost, heart, connection, honest, truth, clarity]
    lisa: [lisa, chat, hang out, hanging out, bored, random, funny, comedy, standup, joke, news, idea, ideas, bounce, vibe, vibes]
    sage: [sage, philosophy, debate, challenge, meaning, ethics, logic]
    ops: [ops, code, bug, server, deploy, flask, sqlite, python, linux, terminal]
    jack: [jack, grow, grower, plant, plants, tent, strain, cannabis, weed, harvest, flower, flowering, veg, seedling, checkin, check in, watering, soil, humidity, vpd, dli]

memory:
  enabled: true
  # All memory is now in PostgreSQL (kiro database). No SQLite.
  database:
    host: localhost
    port: 5432
    dbname: kiro
    user: kiro
    password: ""
  # Legacy SQLite path (for one-time migration only)
  legacy_sqlite_path: ./data/kiro.db
  # Shelf embedding model (Tier 1 coarse retrieval)
  embedding:
    provider: openai
    model: text-embedding-3-small
  # All HRR/glass/promotion/cache tuning lives in memory_config table.
  # Values here are only used as bootstrap defaults during schema creation.
  retrieval:
    top_k: 5
  privacy:
    local_only: true
    include_memories_in_cloud_prompts: true

