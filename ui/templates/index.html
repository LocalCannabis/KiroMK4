<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ================================================================
   KIRO UI — Design System
   ================================================================ */

:root {
    --bg-root: #0D0F0E;
    --bg-sidebar: #131614;
    --bg-sidebar-hover: #1A1E1B;
    --bg-chat: #0D0F0E;
    --bg-input: #131614;
    --bg-input-focus: #1A1E1B;
    --bg-user-msg: #1A1E1B;
    --bg-assist-msg: transparent;
    --bg-session-active: #1A1E1B;
    --bg-session-hover: #151916;

    --text-primary: #E8E6E1;
    --text-secondary: #8A8880;
    --text-tertiary: #5A5850;
    --text-input: #E8E6E1;

    --border-subtle: #1E2220;
    --border-medium: #2A2E2B;

    --accent: #C9A84C;  /* default, overridden per persona */
    --accent-dim: #8A7233;

    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;

    --sidebar-width: 260px;
    --session-panel-width: 240px;
}

/* ================================================================
   Reset & Base
   ================================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-root);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ================================================================
   Layout Shell
   ================================================================ */

#app {
    display: flex;
    height: 100vh;
    width: 100vw;
}

/* ================================================================
   Persona Sidebar (left rail)
   ================================================================ */

#persona-rail {
    width: 68px;
    min-width: 68px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 4px;
}

#persona-rail .logo {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--text-tertiary);
    margin-bottom: 16px;
    user-select: none;
}

.persona-btn {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    position: relative;
    transition: background 0.15s, transform 0.1s;
}

.persona-btn:hover {
    background: var(--bg-sidebar-hover);
    transform: scale(1.05);
}

.persona-btn.active {
    background: var(--bg-sidebar-hover);
}

.persona-btn.active::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    border-radius: 0 2px 2px 0;
    background: var(--accent);
}

.persona-btn .tooltip {
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    background: #1A1E1B;
    border: 1px solid var(--border-medium);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
}

.persona-btn:hover .tooltip {
    opacity: 1;
}

/* ================================================================
   Session Panel (second column)
   ================================================================ */

#session-panel {
    width: var(--session-panel-width);
    min-width: var(--session-panel-width);
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#session-panel .panel-header {
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-subtle);
}

#session-panel .panel-header h2 {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
}

#new-session-btn {
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-medium);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
}

#new-session-btn:hover {
    background: var(--bg-sidebar-hover);
    color: var(--text-primary);
    border-color: var(--accent);
}

#session-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.session-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
}

.session-item:hover {
    background: var(--bg-session-hover);
}

.session-item.active {
    background: var(--bg-session-active);
}

.session-item .session-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
}

.session-item .session-meta {
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    flex-shrink: 0;
}

.session-item .session-delete {
    opacity: 0;
    border: none;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 14px;
    padding: 0 2px;
    transition: opacity 0.1s, color 0.1s;
    flex-shrink: 0;
}

.session-item:hover .session-delete {
    opacity: 1;
}

.session-item .session-delete:hover {
    color: #D45555;
}

/* ================================================================
   Chat Area (main content)
   ================================================================ */

#chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-chat);
}

/* Chat header */
#chat-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
}

#chat-header .persona-avatar {
    font-size: 22px;
}

#chat-header .persona-info h1 {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
}

#chat-header .persona-info .persona-role {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
}

/* Messages area */
#messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

/* Welcome state */
#welcome-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 40px;
}

#welcome-state .welcome-avatar {
    font-size: 48px;
    margin-bottom: 4px;
}

#welcome-state .welcome-name {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
}

#welcome-state .welcome-role {
    font-size: 14px;
    color: var(--text-secondary);
}

#welcome-state .welcome-greeting {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 480px;
    line-height: 1.7;
    margin-top: 8px;
}

/* Message bubbles */
.message {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    line-height: 1.7;
    word-wrap: break-word;
    animation: msgIn 0.2s ease-out;
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.message.user {
    background: var(--bg-user-msg);
    color: var(--text-primary);
    align-self: flex-end;
    border: 1px solid var(--border-subtle);
}

.message.assistant {
    background: var(--bg-assist-msg);
    color: var(--text-primary);
    align-self: flex-start;
}

.message.assistant .msg-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 4px;
}

/* Markdown-ish content styling */
.message p { margin-bottom: 8px; }
.message p:last-child { margin-bottom: 0; }
.message code {
    font-family: var(--font-mono);
    font-size: 12.5px;
    background: rgba(255,255,255,0.05);
    padding: 1px 5px;
    border-radius: 3px;
}
.message pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
}
.message pre code {
    background: none;
    padding: 0;
    font-size: 12px;
}
.message strong { font-weight: 600; }
.message em { font-style: italic; color: var(--text-secondary); }
.message ul, .message ol { margin: 6px 0; padding-left: 20px; }
.message li { margin-bottom: 3px; }

/* Streaming cursor */
.streaming-cursor::after {
    content: '▊';
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    margin-left: 1px;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* ================================================================
   Input Area
   ================================================================ */

#input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border-subtle);
}

#input-wrapper {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg-input);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-lg);
    padding: 6px 6px 6px 16px;
    transition: border-color 0.2s, background 0.2s;
}

#input-wrapper:focus-within {
    border-color: var(--accent);
    background: var(--bg-input-focus);
}

#message-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text-input);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    padding: 8px 0;
}

#message-input::placeholder {
    color: var(--text-tertiary);
}

#send-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    border: none;
    background: var(--accent);
    color: var(--bg-root);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
}

#send-btn:hover {
    filter: brightness(1.1);
    transform: scale(1.05);
}

#send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
}

#send-btn svg {
    width: 16px;
    height: 16px;
}

/* ================================================================
   Empty / No Session State
   ================================================================ */

.empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-tertiary);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    line-height: 1.6;
}

/* ================================================================
   Responsive
   ================================================================ */

@media (max-width: 768px) {
    #session-panel { display: none; }
}

/* ================================================================
   Proactive Catchup Banner
   ================================================================ */

#catchup-banner {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: linear-gradient(135deg, rgba(201, 168, 76, 0.08) 0%, rgba(201, 168, 76, 0.03) 100%);
    border-bottom: 1px solid rgba(201, 168, 76, 0.2);
    animation: bannerSlideIn 0.3s ease-out;
    cursor: default;
}

@keyframes bannerSlideIn {
    from { opacity: 0; transform: translateY(-100%); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes bannerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

#catchup-banner .catchup-icon {
    font-size: 18px;
    flex-shrink: 0;
    animation: bannerPulse 2s ease-in-out infinite;
}

#catchup-banner .catchup-text {
    flex: 1;
    font-size: 13px;
    color: var(--text-secondary);
}

#catchup-banner .catchup-text strong {
    color: #C9A84C;
    font-weight: 600;
}

#catchup-banner .catchup-action {
    padding: 5px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(201, 168, 76, 0.3);
    background: rgba(201, 168, 76, 0.1);
    color: #C9A84C;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}

#catchup-banner .catchup-action:hover {
    background: rgba(201, 168, 76, 0.2);
    border-color: rgba(201, 168, 76, 0.5);
}

#catchup-banner .catchup-dismiss {
    border: none;
    background: none;
    color: var(--text-tertiary);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    transition: color 0.15s;
    flex-shrink: 0;
}

#catchup-banner .catchup-dismiss:hover {
    color: var(--text-secondary);
}
</style>
</head>
<body>

<div id="app">
    <!-- Persona Rail -->
    <nav id="persona-rail">
        <div class="logo">KIRO</div>
        {% for key in persona_order %}
        <button class="persona-btn" data-persona="{{ key }}" title="{{ personas[key].name }}">
            {{ personas[key].avatar }}
            <span class="tooltip">{{ personas[key].name }}</span>
        </button>
        {% endfor %}
    </nav>

    <!-- Session Panel -->
    <aside id="session-panel">
        <div class="panel-header">
            <h2 id="session-panel-title">SESSIONS</h2>
            <button id="new-session-btn" title="New session">+</button>
        </div>
        <div id="session-list">
            <div class="empty-state">Select a persona to begin</div>
        </div>
    </aside>

    <!-- Chat Area -->
    <main id="chat-area">
        <!-- Proactive Catchup Banner -->
        <div id="catchup-banner">
            <span class="catchup-icon">⚡</span>
            <span class="catchup-text"><strong>KIRO</strong> — <span id="catchup-label">Morning catchup</span> ready</span>
            <button class="catchup-action" id="catchup-view-btn">VIEW</button>
            <button class="catchup-dismiss" id="catchup-dismiss-btn" title="Dismiss">×</button>
        </div>

        <div id="chat-header" style="display:none;">
            <span class="persona-avatar" id="header-avatar"></span>
            <div class="persona-info">
                <h1 id="header-name"></h1>
                <span class="persona-role" id="header-role"></span>
            </div>
        </div>

        <div id="messages-container">
            <div class="empty-state">
                Pick a persona from the rail and start a session.
            </div>
        </div>

        <div id="input-area" style="display:none;">
            <div id="input-wrapper">
                <textarea id="message-input" rows="1" placeholder="Talk to KIRO..."></textarea>
                <button id="send-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
    </main>
</div>

<script>
/* ================================================================
   KIRO UI — Client
   ================================================================ */

const PERSONAS = {{ personas | tojson }};
const PERSONA_ORDER = {{ persona_order | tojson }};

const state = {
    activePersona: null,
    activeSession: null,
    sessions: {},
    streaming: false,
};

// DOM refs
const $personaRail = document.getElementById('persona-rail');
const $sessionPanel = document.getElementById('session-panel');
const $sessionPanelTitle = document.getElementById('session-panel-title');
const $sessionList = document.getElementById('session-list');
const $newSessionBtn = document.getElementById('new-session-btn');
const $chatArea = document.getElementById('chat-area');
const $chatHeader = document.getElementById('chat-header');
const $headerAvatar = document.getElementById('header-avatar');
const $headerName = document.getElementById('header-name');
const $headerRole = document.getElementById('header-role');
const $messagesContainer = document.getElementById('messages-container');
const $inputArea = document.getElementById('input-area');
const $messageInput = document.getElementById('message-input');
const $sendBtn = document.getElementById('send-btn');


/* ----------------------------------------------------------------
   Persona Selection
   ---------------------------------------------------------------- */

function selectPersona(key) {
    if (state.streaming) return;
    state.activePersona = key;
    state.activeSession = null;

    const persona = PERSONAS[key];

    // Update accent color globally
    document.documentElement.style.setProperty('--accent', persona.accent);
    document.documentElement.style.setProperty('--accent-dim', persona.accent_dim);

    // Update rail active state
    document.querySelectorAll('.persona-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.persona === key);
    });

    // Update header
    $chatHeader.style.display = 'flex';
    $headerAvatar.textContent = persona.avatar;
    $headerName.textContent = persona.name;
    $headerRole.textContent = persona.role;

    // Update input placeholder
    $messageInput.placeholder = `Talk to ${persona.name}...`;

    // Load sessions
    loadSessions(key);

    // Show welcome state
    showWelcome(persona);
    $inputArea.style.display = 'block';
}

function showWelcome(persona) {
    $messagesContainer.innerHTML = `
        <div id="welcome-state">
            <div class="welcome-avatar">${persona.avatar}</div>
            <div class="welcome-name">${persona.name}</div>
            <div class="welcome-role">${persona.role}</div>
            <div class="welcome-greeting">${persona.greeting}</div>
        </div>
    `;
}


/* ----------------------------------------------------------------
   Sessions
   ---------------------------------------------------------------- */

async function loadSessions(personaKey) {
    try {
        const resp = await fetch(`/api/sessions/${personaKey}`);
        const sessions = await resp.json();
        state.sessions[personaKey] = sessions;
        renderSessionList(sessions);
    } catch (err) {
        console.error('Failed to load sessions:', err);
    }
}

function renderSessionList(sessions) {
    if (!sessions.length) {
        $sessionList.innerHTML = `
            <div class="empty-state">
                No sessions yet.<br>Send a message to start one.
            </div>
        `;
        return;
    }

    $sessionList.innerHTML = sessions.map(s => {
        const isActive = state.activeSession === s.id;
        const date = new Date(s.updated_at);
        const timeStr = formatRelativeTime(date);
        return `
            <div class="session-item ${isActive ? 'active' : ''}"
                 data-session-id="${s.id}"
                 onclick="selectSession(${s.id})">
                <span class="session-title">${escapeHtml(s.title)}</span>
                <span class="session-meta">${timeStr}</span>
                <button class="session-delete" onclick="event.stopPropagation(); deleteSession(${s.id})" title="Delete">×</button>
            </div>
        `;
    }).join('');
}

async function selectSession(sessionId) {
    if (state.streaming) return;
    state.activeSession = sessionId;

    // Re-render session list to show active
    const sessions = state.sessions[state.activePersona] || [];
    renderSessionList(sessions);

    // Load messages
    try {
        const resp = await fetch(`/api/messages/${sessionId}`);
        const messages = await resp.json();
        renderMessages(messages);
    } catch (err) {
        console.error('Failed to load messages:', err);
    }
}

async function createSession() {
    if (!state.activePersona || state.streaming) return;

    try {
        const resp = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ persona_key: state.activePersona }),
        });
        const session = await resp.json();
        await loadSessions(state.activePersona);
        selectSession(session.id);
    } catch (err) {
        console.error('Failed to create session:', err);
    }
}

async function deleteSession(sessionId) {
    if (state.streaming) return;
    try {
        await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
        if (state.activeSession === sessionId) {
            state.activeSession = null;
            showWelcome(PERSONAS[state.activePersona]);
        }
        await loadSessions(state.activePersona);
    } catch (err) {
        console.error('Failed to delete session:', err);
    }
}


/* ----------------------------------------------------------------
   Messages
   ---------------------------------------------------------------- */

function renderMessages(messages) {
    if (!messages.length) {
        const persona = PERSONAS[state.activePersona];
        showWelcome(persona);
        return;
    }

    const persona = PERSONAS[state.activePersona];
    $messagesContainer.innerHTML = messages.map(m => renderMessage(m, persona)).join('');
    scrollToBottom();
}

function renderMessage(msg, persona) {
    if (msg.role === 'user') {
        return `<div class="message user">${formatContent(msg.content)}</div>`;
    } else {
        return `
            <div class="message assistant">
                <div class="msg-label">${persona.name}</div>
                ${formatContent(msg.content)}
            </div>
        `;
    }
}

function appendMessage(role, content, persona) {
    // Remove welcome state if present
    const welcome = document.getElementById('welcome-state');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    if (role === 'assistant') {
        div.innerHTML = `<div class="msg-label">${persona.name}</div><span class="msg-content"></span>`;
    } else {
        div.innerHTML = formatContent(content);
    }

    $messagesContainer.appendChild(div);
    scrollToBottom();
    return div;
}


/* ----------------------------------------------------------------
   Sending & Streaming
   ---------------------------------------------------------------- */

async function sendMessage() {
    const content = $messageInput.value.trim();
    if (!content || state.streaming || !state.activePersona) return;

    // Auto-create session if none active
    if (!state.activeSession) {
        try {
            const resp = await fetch('/api/sessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ persona_key: state.activePersona }),
            });
            const session = await resp.json();
            state.activeSession = session.id;
            await loadSessions(state.activePersona);
            renderSessionList(state.sessions[state.activePersona] || []);
        } catch (err) {
            console.error('Failed to create session:', err);
            return;
        }
    }

    const persona = PERSONAS[state.activePersona];

    // Show user message immediately
    appendMessage('user', content, persona);
    $messageInput.value = '';
    autoResizeInput();
    updateSendBtn();

    // Create assistant message placeholder
    const assistantDiv = appendMessage('assistant', '', persona);
    const contentSpan = assistantDiv.querySelector('.msg-content');
    contentSpan.classList.add('streaming-cursor');

    state.streaming = true;
    $sendBtn.disabled = true;

    try {
        const resp = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: state.activeSession,
                content: content,
            }),
        });

        // Check if it's a streaming response
        const contentType = resp.headers.get('content-type') || '';

        if (contentType.includes('text/event-stream')) {
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    try {
                        const data = JSON.parse(line.slice(6));
                        if (data.token) {
                            fullText += data.token;
                            contentSpan.innerHTML = formatContent(fullText);
                            scrollToBottom();
                        }
                        if (data.done) {
                            // Streaming complete
                        }
                    } catch (e) {}
                }
            }
        } else {
            // Non-streaming (no API key configured)
            const data = await resp.json();
            if (data.message) {
                contentSpan.innerHTML = formatContent(data.message.content);
            }
        }
    } catch (err) {
        contentSpan.innerHTML = formatContent(`[Error: ${err.message}]`);
    }

    contentSpan.classList.remove('streaming-cursor');
    state.streaming = false;
    updateSendBtn();

    // Refresh session list to update titles/timestamps
    await loadSessions(state.activePersona);
}


/* ----------------------------------------------------------------
   Formatting Helpers
   ---------------------------------------------------------------- */

function formatContent(text) {
    // Basic markdown-ish rendering (no heavy lib needed)
    let html = escapeHtml(text);

    // Code blocks (```...```)
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre><code>${code.trim()}</code></pre>`;
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Italic
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Line breaks → paragraphs
    html = html.replace(/\n\n+/g, '</p><p>');
    html = html.replace(/\n/g, '<br>');
    html = `<p>${html}</p>`;

    return html;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function formatRelativeTime(date) {
    const now = new Date();
    const diffMs = now - date;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHr = Math.floor(diffMs / 3600000);
    const diffDay = Math.floor(diffMs / 86400000);

    if (diffMin < 1) return 'now';
    if (diffMin < 60) return `${diffMin}m`;
    if (diffHr < 24) return `${diffHr}h`;
    if (diffDay < 7) return `${diffDay}d`;
    return date.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        $messagesContainer.scrollTop = $messagesContainer.scrollHeight;
    });
}


/* ----------------------------------------------------------------
   Input Handling
   ---------------------------------------------------------------- */

function autoResizeInput() {
    $messageInput.style.height = 'auto';
    $messageInput.style.height = Math.min($messageInput.scrollHeight, 160) + 'px';
}

function updateSendBtn() {
    $sendBtn.disabled = !$messageInput.value.trim() || state.streaming;
}

$messageInput.addEventListener('input', () => {
    autoResizeInput();
    updateSendBtn();
});

$messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

$sendBtn.addEventListener('click', sendMessage);
$newSessionBtn.addEventListener('click', createSession);

// Persona button handlers
document.querySelectorAll('.persona-btn').forEach(btn => {
    btn.addEventListener('click', () => selectPersona(btn.dataset.persona));
});


/* ----------------------------------------------------------------
   Keyboard Shortcuts
   ---------------------------------------------------------------- */

document.addEventListener('keydown', (e) => {
    // Ctrl+N — new session
    if (e.ctrlKey && e.key === 'n') {
        e.preventDefault();
        createSession();
    }
    // Ctrl+1-7 — switch persona
    if (e.ctrlKey && e.key >= '1' && e.key <= '7') {
        e.preventDefault();
        const idx = parseInt(e.key) - 1;
        if (PERSONA_ORDER[idx]) selectPersona(PERSONA_ORDER[idx]);
    }
    // Escape — focus input
    if (e.key === 'Escape') {
        $messageInput.focus();
    }
});


/* ----------------------------------------------------------------
   Proactive Catchup System
   ---------------------------------------------------------------- */

const $catchupBanner = document.getElementById('catchup-banner');
const $catchupLabel = document.getElementById('catchup-label');
const $catchupViewBtn = document.getElementById('catchup-view-btn');
const $catchupDismissBtn = document.getElementById('catchup-dismiss-btn');

let catchupPollTimer = null;
let catchupPeriod = 'morning';

function startCatchupPolling() {
    // Don't poll if tab is hidden
    if (document.hidden) return;

    // Check localStorage cooldown (client-side gate)
    const lastSeen = localStorage.getItem('kiro_catchup_last');
    if (lastSeen) {
        const elapsed = (Date.now() - parseInt(lastSeen)) / (1000 * 60 * 60);
        if (elapsed < 4) return;  // 4-hour client-side cooldown
    }

    checkCatchup();
}

async function checkCatchup() {
    try {
        const resp = await fetch('/api/catchup/check');
        const data = await resp.json();

        if (data.available) {
            catchupPeriod = data.period;
            $catchupLabel.textContent = data.label;
            $catchupBanner.style.display = 'flex';
        } else {
            $catchupBanner.style.display = 'none';
        }
    } catch (e) {
        console.debug('Catchup check failed:', e);
    }
}

async function viewCatchup() {
    // Record that we're viewing (prevent re-showing)
    localStorage.setItem('kiro_catchup_last', Date.now().toString());
    $catchupBanner.style.display = 'none';

    // Switch to Kiro persona
    selectPersona('kiro');

    // Wait for sessions to load
    await new Promise(r => setTimeout(r, 300));

    // Create a catchup session
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
    const periodLabel = catchupPeriod.charAt(0).toUpperCase() + catchupPeriod.slice(1);
    const title = `${periodLabel} Catchup — ${dateStr}`;

    try {
        const resp = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ persona_key: 'kiro', title: title }),
        });
        const session = await resp.json();
        state.activeSession = session.id;
        await loadSessions('kiro');
        renderSessionList(state.sessions['kiro'] || []);

        // Remove welcome state
        const welcome = document.getElementById('welcome-state');
        if (welcome) welcome.remove();

        // Create assistant placeholder
        const persona = PERSONAS['kiro'];
        const assistantDiv = appendMessage('assistant', '', persona);
        const contentSpan = assistantDiv.querySelector('.msg-content');
        contentSpan.classList.add('streaming-cursor');

        state.streaming = true;
        $sendBtn.disabled = true;

        // Stream the catchup
        const catchupResp = await fetch('/api/catchup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: session.id }),
        });

        const reader = catchupResp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                try {
                    const data = JSON.parse(line.slice(6));
                    if (data.token) {
                        fullText += data.token;
                        contentSpan.innerHTML = formatContent(fullText);
                        scrollToBottom();
                    }
                } catch (e) {}
            }
        }

        contentSpan.classList.remove('streaming-cursor');
        state.streaming = false;
        updateSendBtn();
        await loadSessions('kiro');

    } catch (err) {
        console.error('Catchup delivery failed:', err);
        state.streaming = false;
        updateSendBtn();
    }
}

async function dismissCatchup() {
    localStorage.setItem('kiro_catchup_last', Date.now().toString());
    $catchupBanner.style.display = 'none';
    try {
        await fetch('/api/catchup/dismiss', { method: 'POST' });
    } catch (e) {}
}

$catchupViewBtn.addEventListener('click', viewCatchup);
$catchupDismissBtn.addEventListener('click', dismissCatchup);

// Poll every 60 seconds; also check on visibility change
catchupPollTimer = setInterval(startCatchupPolling, 60000);
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) startCatchupPolling();
});

// Initial check after a short delay (let page settle)
setTimeout(startCatchupPolling, 2000);


/* ----------------------------------------------------------------
   Init — select KIRO by default
   ---------------------------------------------------------------- */

selectPersona('kiro');
$messageInput.focus();

</script>
